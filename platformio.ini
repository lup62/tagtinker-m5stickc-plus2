; TagTinker for M5StickC Plus2
; Build:  pio run            Flash: pio run -t upload
[env:m5stick-c-plus2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c-plus2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTT_VERSION=\"1.0\"
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.34
    https://github.com/m5stack/M5Unified.git#0.2.27
    FS
    LittleFS
    WiFi
    WebServer
    DNSServer
    ESPmDNS
    Preferences
lib_ldf_mode = deep+
extra_scripts = pre:tools/embed_web.py
